    let FLAT_INDEX = [];
    MANUAL_DATA.forEach(chap => {
        chap.sections.forEach(sect => {
            sect.terms.forEach(term => {
                FLAT_INDEX.push({
                    ...term,
                    chapIdx: chap.index,
                    sectIdx: sect.index,
                    path_zh: `${chap.title_zh} > ${sect.title_zh}`,
                    path_ru: `${chap.title_ru} > ${sect.title_ru}`
                });
            });
        });
    });

    let appState = {
        lang: 'cn', 
        view: 'home', 
        chapIdx: null,
        sectIdx: null,
        keyword: '' 
    };
    let descCache = {}; 

    const content = document.getElementById('content');
    const pageTitle = document.getElementById('pageTitle');
    const navBack = document.querySelector('.nav-back');
    const searchWrapper = document.getElementById('searchWrapper');
    const searchInput = document.getElementById('searchInput');
    const langBtnCN = document.getElementById('lang-cn');
    const langBtnRU = document.getElementById('lang-ru');

    window.addEventListener('popstate', (event) => {
        if (event.state) restoreState(event.state);
        else restoreState({ view: 'home' });
    });

    init();

    function init() {
        const hash = window.location.hash;
        if (hash.startsWith('#section=')) {
            const [c, s] = hash.replace('#section=', '').split('-');
            navigateTo('section', parseInt(c), parseInt(s), true);
        } else if (hash.startsWith('#chapter=')) {
            const c = hash.replace('#chapter=', '');
            navigateTo('chapter', parseInt(c), null, true);
        } else {
            renderHome();
        }
    }

    // ================= 状态恢复逻辑 =================
    function restoreState(state) {
        appState.view = state.view || 'home';
        appState.chapIdx = state.chapIdx;
        appState.sectIdx = state.sectIdx;
        appState.keyword = state.keyword || ''; // 恢复关键词
        
        // 核心：如果 keyword 存在，必须回填到输入框，这样界面才不会空白
        searchInput.value = appState.keyword;
        
        refreshCurrentView();
    }

    function navigateTo(view, chapIdx, sectIdx, replace = false) {
        // 跳转到新页面时，通常清空搜索词 (除非您希望带着搜索词跳转)
        // 这里设定为清空，因为从首页跳到详情页，详情页是局部搜索，首页词未必适用
        // 但如果您是从"全局结果"点击进入"详情页"，此时详情页会重置为空白搜索
        appState.view = view;
        appState.chapIdx = chapIdx;
        appState.sectIdx = sectIdx;
        appState.keyword = ''; // 新页面默认无搜索
        searchInput.value = '';

        const state = { view, chapIdx, sectIdx, keyword: '' };
        let url = '#';
        if (view === 'chapter') url = `#chapter=${chapIdx}`;
        if (view === 'section') url = `#section=${chapIdx}-${sectIdx}`;
        
        if (replace) history.replaceState(state, '', url);
        else history.pushState(state, '', url);

        refreshCurrentView();
    }

    // 搜索输入时，更新 state (为了让后退时能记住)
    function updateSearchState(val) {
        appState.keyword = val;
        // 使用 replaceState 更新当前历史记录，只改 state 中的 keyword，不产生新记录
        const currentState = history.state || {};
        currentState.keyword = val;
        history.replaceState(currentState, '');
    }

    window.switchLang = function(lang) {
        appState.lang = lang;
        if (lang === 'ru') {
            langBtnCN.classList.remove('active');
            langBtnRU.classList.add('active');
        } else {
            langBtnCN.classList.add('active');
            langBtnRU.classList.remove('active');
        }
        refreshCurrentView();
    }

    function refreshCurrentView() {
        if (appState.keyword && appState.keyword.length > 0) {
            handleSearchInput();
            return;
        }
        if (appState.view === 'home') renderHome();
        else if (appState.view === 'chapter') renderChapter();
        else if (appState.view === 'section') renderSection();
    }

    function renderHome() {
        navBack.style.display = 'none';
        searchWrapper.style.display = 'block';
        
        const ui = UI_TEXT[appState.lang];
        pageTitle.textContent = ui.title;
        searchInput.placeholder = ui.search_home;

        let html = '<ul class="list-group">';
        MANUAL_DATA.forEach(chap => {
            const title = appState.lang === 'ru' ? chap.title_ru : chap.title_zh;
            const subTitle = ui.total_sections.replace('{n}', chap.sections.length);
            html += `
                <li class="list-item" onclick="navigateTo('chapter', ${chap.index})">
                    <div class="item-info">
                        <h3>${title}</h3>
                        <p>${subTitle}</p>
                    </div>
                    <div class="item-arrow">❯</div>
                </li>
            `;
        });
        html += '</ul>';
        content.innerHTML = html;
    }

    function renderChapter() {
        const chap = MANUAL_DATA.find(c => c.index === appState.chapIdx);
        const ui = UI_TEXT[appState.lang];
        
        navBack.style.display = 'block';
        searchWrapper.style.display = 'none';
        pageTitle.textContent = appState.lang === 'ru' ? chap.title_ru : chap.title_zh;

        let html = '<ul class="list-group">';
        chap.sections.forEach(sect => {
            const title = appState.lang === 'ru' ? sect.title_ru : sect.title_zh;
            const subTitle = ui.total_terms.replace('{n}', sect.terms.length);
            html += `
                <li class="list-item" onclick="navigateTo('section', ${chap.index}, ${sect.index})">
                    <div class="item-info">
                        <h3>${title}</h3>
                        <p>${subTitle}</p>
                    </div>
                    <div class="item-arrow">❯</div>
                </li>
            `;
        });
        html += '</ul>';
        content.innerHTML = html;
    }

    function renderSection() {
        const chap = MANUAL_DATA.find(c => c.index === appState.chapIdx);
        const sect = chap.sections.find(s => s.index === appState.sectIdx);
        const ui = UI_TEXT[appState.lang];
        
        navBack.style.display = 'block';
        searchWrapper.style.display = 'block';
        searchInput.placeholder = ui.search_section;
        pageTitle.textContent = appState.lang === 'ru' ? sect.title_ru : sect.title_zh;

        renderTerms(sect.terms);
    }

    function renderTerms(terms) {
        const ui = UI_TEXT[appState.lang];
        if (!terms || terms.length === 0) {
            content.innerHTML = `<div class="empty-tip">${ui.empty}</div>`;
            return;
        }

        let html = '';
        terms.forEach(term => {
            const shortId = term.id.split('-').pop(); 
            let mainText, subText;
            if (appState.lang === 'ru') {
                mainText = term.ru;
                subText = term.zh; 
            } else {
                mainText = term.zh;
                subText = term.ru;
            }

            html += `
                <div class="term-card" id="card-${term.id}">
                    <div class="term-header">
                        <span class="term-main">${mainText}</span>
                        <span class="term-id">#${shortId}</span>
                    </div>
                    <span class="term-sub">${subText}</span>
                    <div class="term-en">${term.en}</div>
                    
                    <div class="term-tools">
                        <button class="btn-info" onclick="toggleDesc('${term.id}')">${ui.btn_desc}</button>
                    </div>
                    <div class="term-desc" id="desc-${term.id}"></div>
                    
                    <div class="btn-grid">
                        <button class="btn btn-zh" onclick="playAudio('${term.id}', 'zh')">CN</button>
                        <button class="btn btn-en" onclick="playAudio('${term.id}', 'en')">EN</button>
                        <button class="btn btn-ru" onclick="playAudio('${term.id}', 'ru')">RU</button>
                    </div>
                </div>
            `;
        });
        content.innerHTML = html;
    }

    searchInput.addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase().trim();
        updateSearchState(val); // 核心：实时保存搜索词到 History
        handleSearchInput();
    });

    function handleSearchInput() {
        const keyword = appState.keyword;

        if (appState.view === 'section') {
            const chap = MANUAL_DATA.find(c => c.index === appState.chapIdx);
            const sect = chap.sections.find(s => s.index === appState.sectIdx);
            const filtered = sect.terms.filter(t => matchTerm(t, keyword));
            renderTerms(filtered);
            return;
        }

        if (appState.view === 'home') {
            if (keyword.length > 0) {
                const results = FLAT_INDEX.filter(t => matchTerm(t, keyword));
                renderGlobalResults(results);
            } else {
                renderHome();
            }
        }
    }

    function matchTerm(t, k) {
        const shortId = t.id.split('-').pop();
        return (
            t.zh.includes(k) || 
            t.ru.toLowerCase().includes(k) || 
            t.en.toLowerCase().includes(k) || 
            shortId === k || 
            t.id === k
        );
    }

    function renderGlobalResults(results) {
        if (results.length === 0) {
            content.innerHTML = '<div class="empty-tip">未找到 / Нет результатов</div>';
            return;
        }
        let html = '<div style="background:white; border-radius:12px; overflow:hidden;">';
        results.forEach(t => {
            // 搜索结果页也遵循主/副语言逻辑
            let main, sub;
            if (appState.lang === 'ru') {
                main = t.ru;
                sub = t.zh;
            } else {
                main = t.zh;
                sub = t.ru;
            }
            const path = appState.lang === 'ru' ? t.path_ru : t.path_zh;
            
            html += `
                <div class="global-result-item" onclick="jumpToTerm(${t.chapIdx}, ${t.sectIdx}, '${t.id}')">
                    <div class="global-result-title">${main} <span style="font-size:12px;color:#999">#${t.id}</span></div>
                    <div class="global-result-sub">${sub}</div>
                    <div class="global-result-en">${t.en}</div>
                    <div class="global-result-path">📂 ${path}</div>
                </div>
            `;
        });
        html += '</div>';
        content.innerHTML = html;
    }

    window.jumpToTerm = function(cIdx, sIdx, termId) {
        navigateTo('section', cIdx, sIdx);
        setTimeout(() => {
            const card = document.getElementById(`card-${termId}`);
            if (card) {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                card.style.border = "2px solid #ff9800";
                setTimeout(() => card.style.border = "", 2000);
            }
        }, 300);
    }

    window.goBack = function() {
        window.history.back();
    };

    window.toggleDesc = async function(id) {
        const descBox = document.getElementById(`desc-${id}`);
        const ui = UI_TEXT[appState.lang];
        if (descBox.classList.contains('show')) { descBox.classList.remove('show'); return; }
        descBox.innerHTML = ui.loading;
        descBox.classList.add('show');

        let targetKey = appState.lang === 'ru' ? `${id}.ru` : id;
        if (descCache[targetKey]) { descBox.innerHTML = `<strong>${ui.def_title}</strong><br>${descCache[targetKey]}`; return; }

        const parts = id.split('-');
        let jsonName = `${parts[0]}-${parts[1]}`;
        if (appState.lang === 'ru') jsonName += "_ru";

        try {
            const fileKey = `_loaded_${jsonName}`;
            if (!descCache[fileKey]) {
                const url = `${JSON_BASE}${jsonName}.json`;
                const resp = await fetch(url);
                if (!resp.ok) throw new Error("File err");
                const json = await resp.json();
                Object.assign(descCache, json);
                descCache[fileKey] = true;
            }
            let text = descCache[targetKey] || (appState.lang === 'ru' ? descCache[id] : null) || ui.no_desc;
            descBox.innerHTML = `<strong>${ui.def_title}</strong><br>${text}`;
        } catch (e) { descBox.innerHTML = "<span style='color:red'>Network Error</span>"; }
    }

   let currentAudio = null;

    window.playAudio = function(id, lang) {
        // 1. 检查是否有正在播放的音频 (Check if audio is playing)
        if (currentAudio) {
            currentAudio.pause();         // 暂停当前音频
            currentAudio.currentTime = 0; // 将进度归零
        }

        const path = `${AUDIO_BASE}${id}_${lang}.mp3`;
        
        // 2. 创建新的音频对象，并赋值给全局变量
        currentAudio = new Audio(path);
        
        // 3. 播放新的音频
        currentAudio.play().catch(e => {
            console.error("Audio play failed:", e);
        });

        // 监听播放结束事件，播放结束后清空变量
        currentAudio.onended = function() {
            currentAudio = null;
        };
    }
</script>
</body>
</html>
